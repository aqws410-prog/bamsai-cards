<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>밤사이 3 유가 달러 금리</title>
<link rel="stylesheet" href="../base.css">
</head>
<body>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 120px 88px; background: #0B1220; color: #F3EEE6; font-family: var(--sans); display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 34px; font-weight: 700; color: #FF8A3D">유가 · 달러 · 금리</div>
<div style="font-family: var(--num); font-size: 30px; color: #A7B0C0">3/6</div>
</div>
<div style="font-size: 60px; font-weight: 900; line-height: 1.25; letter-spacing: -0.02em">유가는 다시 올랐고,<br>채권시장은 하루 휴장</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px">
<div style="background: #18233A; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 10px"><div style="font-size: 32px; font-weight: 700; color: #C9CFDA">브렌트유</div><div style="font-family: var(--num); font-size: 56px; font-weight: 600">$106.65</div><div style="font-family: var(--num); font-size: 36px; font-weight: 600; color: #FF5A5F">▲1.84%</div></div>
<div style="background: #18233A; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 10px"><div style="font-size: 32px; font-weight: 700; color: #C9CFDA">WTI</div><div style="font-family: var(--num); font-size: 56px; font-weight: 600">$93.74</div><div style="font-family: var(--num); font-size: 36px; font-weight: 600; color: #FF5A5F">▲2.06%</div></div>
<div style="background: #18233A; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 10px"><div style="font-size: 32px; font-weight: 700; color: #C9CFDA">원/달러 (12일 종가)</div><div style="font-family: var(--num); font-size: 56px; font-weight: 600">1,335.1원</div><div style="font-family: var(--num); font-size: 36px; font-weight: 600; color: #5AA9FF">▼7.7원</div></div>
<div style="background: #18233A; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 10px"><div style="font-size: 32px; font-weight: 700; color: #C9CFDA">미 국채 10년물</div><div style="font-size: 56px; font-weight: 900">휴장</div><div style="font-size: 26px; color: #A7B0C0; line-height: 1.4">콜럼버스데이 · 직전 거래일 5.24%</div></div>
</div>
<div style="font-size: 24px; color: #A7B0C0">출처: 뉴스핌(유가·국채 휴장), 뉴스1(환율, 서울 주간 종가), AP(10/9 국채)</div>
</div>
</body>
</html>
