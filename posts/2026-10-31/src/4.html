<div style="display: flex; align-items: center; gap: 14px"><div style="width: 14px; height: 14px; border-radius: 7px; background: #FF8A3D"></div><div style="font-size: 32px; font-weight: 700">밤사이 이슈 3</div></div>
<div style="font-size: 30px; color: #CFC4E0">4/6</div>

</div>

<div style="font-size: 22px; color: #CFC4E0; line-height: 1.5">출처: AP·더스트리트·MTN(인텔), 뉴스핌·MTN(엔비디아), AP·MTN(아마존), AP·로이터(유가) · 10.30 현지</div>
