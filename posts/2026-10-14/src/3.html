<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>밤사이 3 유가 달러 금리</title>
<link rel="stylesheet" href="../../../template/base.css">
</head>
<body>
<div style="width: 1080px; height: 1080px; box-sizing: border-box; padding: 88px; background: #0B1220; color: #F3EEE6; font-family: var(--sans); display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 34px; font-weight: 700; color: #FF8A3D">유가 · 환율 · 코스피</div>
<div style="font-family: var(--num); font-size: 30px; color: #A7B0C0">3/6</div>
</div>
<div style="font-size: 60px; font-weight: 900; line-height: 1.25; letter-spacing: -0.02em">유가는 엇갈리고,<br>코스피는 하루 새 5%대 급락</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px">
<div style="background: #18233A; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 10px"><div style="font-size: 32px; font-weight: 700; color: #C9CFDA">브렌트유</div><div style="font-family: var(--num); font-size: 56px; font-weight: 600">$105.69</div><div style="font-family: var(--num); font-size: 36px; font-weight: 600; color: #5AA9FF">▼0.90%</div></div>
<div style="background: #18233A; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 10px"><div style="font-size: 32px; font-weight: 700; color: #C9CFDA">WTI</div><div style="font-family: var(--num); font-size: 56px; font-weight: 600">$94.14</div><div style="font-family: var(--num); font-size: 36px; font-weight: 600; color: #FF5A5F">▲0.43%</div></div>
<div style="background: #18233A; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 10px"><div style="font-size: 32px; font-weight: 700; color: #C9CFDA">원/달러 (13일 종가)</div><div style="font-family: var(--num); font-size: 56px; font-weight: 600">1,345.1원</div><div style="font-family: var(--num); font-size: 36px; font-weight: 600; color: #FF5A5F">▲10.0원</div></div>
<div style="background: #18233A; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 10px"><div style="font-size: 32px; font-weight: 700; color: #C9CFDA">코스피 (13일 종가)</div><div style="font-family: var(--num); font-size: 56px; font-weight: 600">6,035.35</div><div style="font-family: var(--num); font-size: 36px; font-weight: 600; color: #5AA9FF">▼5.46%</div></div>
</div>
<div style="font-size: 24px; color: #A7B0C0">출처: 파이낸셜뉴스·중앙이코노미뉴스(유가), 머니투데이·파이낸셜뉴스(환율), 서울신문·중앙이코노미뉴스(코스피)</div>
</div>
</body>
</html>
